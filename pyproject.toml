[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "neqnn"
version = "0.0.1"
description = "Nonequilibrium dynamics in spin-model transformers."
authors = [{ name = "Matthias Bal", email = "matthiascbal@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "matplotlib>=3.10.0",
    "numpy>=2.4.2",
    "torch>=2.10.0",
]

[dependency-groups]
# scipy is a test-only reference for the Bessel and normalizer routines, never
# imported by the package itself -- which is the point, since it underflows
# exactly where our recurrence has to keep working.
dev = ["pytest>=8.0", "scipy>=1.14"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["neqnn"]
